<section class="auth-page">
  <div class="auth-visual">
    <blockquote>"El disfraz perfecto para cada historia"</blockquote>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form card">
      <h1>Bienvenido de vuelta</h1>
      <p class="text-muted">Ingresa tus datos para continuar</p>

      <form (ngSubmit)="iniciarSesion()">
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input
            id="correo"
            type="email"
            placeholder="correo@ejemplo.com"
            [ngModel]="correo()"
            (ngModelChange)="correo.set($event)"
            name="correo"
          />
        </div>

        <div class="field">
          <label for="contrasena">Contraseña</label>
          <input
            id="contrasena"
            type="password"
            placeholder="********"
            [ngModel]="contrasena()"
            (ngModelChange)="contrasena.set($event)"
            name="contrasena"
          />
        </div>

        @if (error()) {
          <p class="field-error">{{ error() }}</p>
        }

        <a class="forgot-link" href="javascript:void(0)">¿Olvidaste tu contraseña?</a>

        <button class="btn btn-primary btn-block" type="submit">Iniciar sesión</button>
      </form>

      <p class="auth-switch">¿No tienes cuenta? <a routerLink="/registro">Regístrate gratis</a></p>

      <div class="demo-access">
        <p class="text-muted">Acceso de demostración</p>
        <div class="demo-buttons">
          <button class="btn btn-secondary btn-sm" type="button" (click)="entrarComoCliente()">
            Entrar como cliente
          </button>
          <button class="btn btn-secondary btn-sm" type="button" (click)="entrarComoAdmin()">
            Entrar como admin
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
