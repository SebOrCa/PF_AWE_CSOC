server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: se reenvia al backend por la red interna de Docker (mismo origen, sin CORS).
    # Se conserva el prefijo /api, por lo que el backend debe exponer sus rutas bajo /api.
    # El nombre se resuelve en cada peticion (DNS de Docker) para que nginx arranque
    # aunque el backend este caido; en ese caso /api responde 502 en vez de fallar todo.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        resolver_timeout 2s;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        # Con el backend caído falla rápido (502/504) en vez de dejar al navegador esperando.
        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: cache larga.
    location ~* \.(?:js|css|woff2?|ico|png|jpg|jpeg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta de Angular cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
